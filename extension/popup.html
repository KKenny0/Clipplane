<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clipplane</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Clipplane</h1>
          <p class="subtitle">Local first clipper</p>
        </div>
        <div class="header-actions">
          <button id="open-settings" class="icon-button" type="button" aria-label="Open settings">Settings</button>
          <span id="state" class="state">Ready</span>
        </div>
      </header>

      <section class="control-group" aria-label="Clip source">
        <button id="mode-selection" class="segment active" type="button">Selection</button>
        <button id="mode-page" class="segment" type="button">Page</button>
      </section>

      <section class="actions" aria-label="Clip actions">
        <button id="clip-local" class="primary" type="button">Save local</button>
        <button id="clip-sync" class="secondary" type="button">Save + sync</button>
      </section>

      <section class="sync-panel" aria-label="Sync status">
        <div>
          <div class="sync-label">Sync target</div>
          <div id="sync-status" class="sync-status">Checking</div>
        </div>
        <button id="configure-sync" class="plain-button" type="button">Configure</button>
      </section>

      <section id="result" class="result" aria-live="polite"></section>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
